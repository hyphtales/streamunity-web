<h1>🎙️ Voix & Avatar</h1>
<p>Personnalise l'apparence et la voix de l'assistant</p>

<div class="bloc-parametres">
    <h3>Réglages de la voix</h3>
    <button id="btn_regler_vitesse" class="btn-secondaire">Régler la vitesse</button>
    <button id="btn_regler_ton" class="btn-secondaire">Régler le ton</button>
    <button id="btn_choisir_sexe_voix" class="btn-secondaire">Choisir le sexe de la voix</button>
    <button id="btn_choisir_langue_voix" class="btn-secondaire">Choisir la langue</button>
    <button id="btn_propre_voix" class="btn-secondaire">Utiliser ma propre voix</button>
</div>

<div class="bloc-parametres">
    <h3>Échantillon</h3>
    <button id="btn_enregistrer_echantillon" class="btn-primaire">🎤 Enregistrer</button>
    <button id="btn_ecouter_echantillon" class="btn-secondaire">Écouter</button>
    <button id="btn_valider_voix" class="btn-primaire">✅ Valider</button>
    <button id="btn_reinitialiser_voix" class="btn-secondaire">🔄 Réinitialiser</button>
</div>

<div class="bloc-parametres">
    <h3>Avatar & Fond</h3>
    <button id="btn_choisir_avatar" class="btn-secondaire">Choisir un avatar</button>
    <button id="btn_importer_avatar" class="btn-secondaire">Importer mon avatar</button>
    <button id="btn_regler_taille_avatar" class="btn-secondaire">Régler la taille</button>
    <button id="btn_choisir_expression" class="btn-secondaire">Choisir l'expression</button>
    <button id="btn_sans_avatar" class="btn-secondaire">Sans avatar</button>
</div>
